; Waveshare ESP32-S3-GEEK + SW3518 charger stats display
; TFT config matches Waveshare demo Setup25_TTGO_T_Display (pins patched for GEEK)
[env:esp32-s3-geek]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Do not enable PSRAM — S3R2 quad is fine in theory but TFT_eSPI + PSRAM has panicked this board.
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ; Board default forces USB_MODE=1; unflag then set TinyUSB CDC for USB-A OTG
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  ; TFT_SDA_READ omitted — hangs/panics tft.begin() on this S3
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=8
  -DTFT_RST=9
  -DTFT_BL=7
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=6000000
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  mathertel/OneButton@^2.6.1
  knolleary/PubSubClient@^2.8
