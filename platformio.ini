; Waveshare ESP32-S3-GEEK + SW3518 charger stats display
; Display: Adafruit_ST7789 (TFT_eSPI tft.begin() panics on this board)
;
; Default image: charger + radio + HID (USB CDC+HID from boot; BLE HID in HID mode).
; esp32-s3-geek-hid is the same env so older upload commands still work.
;
; Separate stick image: env:esp32-s3-geek-msc-stick — USB CDC+MSC TF stick dashboard
; (MoveSpeed-inspired UI) with Stick↔WiFi dual mode. No USB HID / BleCombo.

[env:esp32-s3-geek]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DHAS_RADIO=1
  -DHAS_HID=1
  -DHAS_MSC_STICK=0
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  adafruit/Adafruit GFX Library@^1.11.11
  mathertel/OneButton@^2.6.1
  knolleary/PubSubClient@^2.8
  https://github.com/blackketter/ESP32-BLE-Combo.git#master

[env:esp32-s3-geek-hid]
extends = env:esp32-s3-geek

; USB MSC stick + MoveSpeed-style dashboard (CDC+MSC composite). No HID.
; Triple BOOT: Stick ↔ WiFi (radio_tools). Charger/SW3518 omitted at runtime.
[env:esp32-s3-geek-msc-stick]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DGEEK_USB_GADGET=1
  -DHAS_MSC_STICK=1
  -DHAS_RADIO=1
  -DHAS_HID=0
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  adafruit/Adafruit GFX Library@^1.11.11
  mathertel/OneButton@^2.6.1
  knolleary/PubSubClient@^2.8
